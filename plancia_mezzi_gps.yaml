title: "Mezzi GPS"
views:
  - title: "Mezzi GPS"
    path: mezzi-gps
    icon: mdi:bus
    cards:
      # Mappa: si popola da sola con tutti i device_tracker.gps_*
      - type: custom:auto-entities
        show_empty: true
        card:
          type: map
          title: "Posizione mezzi"
          default_zoom: 12
          hours_to_show: 4
        filter:
          include:
            - entity_id: "device_tracker.gps_*"
      # Riepilogo multimezzo: tabella dinamica (tutti i mezzi, una riga ciascuno)
      - type: markdown
        title: "Riepilogo mezzi"
        content: "| Mezzo | km/h | Sat | Prec (m) | Agg. |\n| --- | --- | --- | --- | --- |\n{% for e in states.device_tracker if e.entity_id.startswith('device_tracker.gps_') %}| {{ e.attributes.friendly_name | default(e.entity_id) }} | {{ e.attributes.speed_kmh | default('-') }} | {{ e.attributes.sats_used | default('-') }} | {{ (e.attributes.gps_accuracy | default(0)) | round(0) }} | {{ relative_time(e.last_updated) }} |\n{% endfor %}"
      # Elenco cliccabile: apri il singolo mezzo per storico/dettagli
      - type: custom:auto-entities
        show_empty: true
        sort:
          method: name
        card:
          type: entities
          title: "Apri un mezzo"
          state_color: true
        filter:
          include:
            - entity_id: "device_tracker.gps_*"
              options:
                secondary_info: last-changed
      # Vista della cartella dei file di tracking giornalieri
      - type: markdown
        title: "File di tracking giornalieri"
        content: "Cartella {{ state_attr('sensor.gps_tracking_files','directory') }} - {{ states('sensor.gps_tracking_files') }} file ({{ state_attr('sensor.gps_tracking_files','total_kb') }} KB). Elenco: {{ (state_attr('sensor.gps_tracking_files','file_list') or []) | join('  |  ') }}"
