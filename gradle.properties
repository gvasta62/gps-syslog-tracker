# Memoria assegnata al processo Gradle durante la compilazione.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Usa le librerie moderne AndroidX (obbligatorio per le dipendenze usate qui).
android.useAndroidX=true
# Stile del codice Kotlin.
kotlin.code.style=official
# Genera una classe R separata per modulo (build piu' veloce).
android.nonTransitiveRClass=true
