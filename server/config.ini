# Configurazione del GPS Syslog Collector.
# Copia questo file, modificalo e avvia:  python3 collector.py --config config.ini

[listen]
bind = 0.0.0.0
udp = true
tcp = true
# Porte in ascolto. Sotto la 1024 (es. 514) serve root o CAP_NET_BIND_SERVICE.
# Per test senza privilegi usa porte alte, es. 5514.
udp_port = 514
tcp_port = 514

[collector]
# Secondi di inattivita' dopo i quali l'ultimo fix in sospeso viene emesso.
flush_timeout = 5.0

# ---------------------------------------------------------------------------
# SCEGLI QUI la destinazione del dato decodificato.
# type = console | csv | jsonl | influxdb | postgres | homeassistant | mqtt
# ---------------------------------------------------------------------------
[sink]
type = console

[csv]
path = fixes.csv

[jsonl]
path = fixes.jsonl

[influxdb]
url = http://localhost:8086
token = IL_TUO_TOKEN
org = la_tua_org
bucket = gps
measurement = gps_fix

[postgres]
# Richiede: pip install psycopg2-binary
dsn = postgresql://utente:password@localhost:5432/gps
table = gps_fix

[homeassistant]
# Richiede un "Long-Lived Access Token" (profilo HA -> Token di accesso).
base_url = http://homeassistant.local:8123
token = IL_TUO_LONG_LIVED_TOKEN
entity_prefix = gps_
# User-Agent: alcuni reverse proxy/Cloudflare bloccano richieste senza UA.
user_agent = curl/8.5.0

[mqtt]
# Richiede: pip install paho-mqtt
host = localhost
port = 1883
username =
password =
topic_prefix = gps
# Se true, pubblica la config di MQTT Discovery: HA crea da solo i device_tracker.
ha_discovery = true
